<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; color: #1f2933;">
  <p>Hi {{ user.first_name|default:user.email }},</p>
  <p>Your Delisushio password reset code is:</p>
  <p style="font-size: 28px; font-weight: bold; letter-spacing: 4px;">{{ reset_code }}</p>
  <p>This code expires in {{ expiry_minutes }} minutes. If you didn't request a password reset, you can safely ignore this email.</p>
  <p><a href="{{ frontend_url }}/accounts/password-reset/confirm/">Enter your code</a></p>
</body>
</html>
