{% extends "base.html" %}
{% block title %}{{ 'New address' if is_new else 'Edit address' }} — Delisushio{% endblock %}
{% block content %}
<h1>{{ 'New delivery address' if is_new else 'Edit delivery address' }}</h1>
<form method="post" class="card-form">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    {% for field in form %}
        <p>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        </p>
    {% endfor %}
    <button type="submit">Save address</button>
</form>
{% endblock %}
