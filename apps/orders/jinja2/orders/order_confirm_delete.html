{% extends "base.html" %}
{% block title %}Cancel order — Delisushio{% endblock %}
{% block content %}
<h1>Cancel order {{ order.id_order|string|truncate(8, True, '') }}?</h1>
<p>This action cannot be undone.</p>
<form method="post">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    <button type="submit" class="btn-danger">Yes, cancel this order</button>
    <a href="{{ url('orders:detail', kwargs={'pk': order.id_order}) }}" class="btn btn-secondary">No, go back</a>
</form>
{% endblock %}
