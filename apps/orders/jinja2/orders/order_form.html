{% extends "base.html" %}
{% block title %}Edit order — Delisushio{% endblock %}
{% block content %}
<h1>Update order {{ order.id_order|string|truncate(8, True, '') }}</h1>
<form method="post" class="card-form">
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
    {% for field in form %}
        <p>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        </p>
    {% endfor %}
    <button type="submit">Save</button>
</form>
{% endblock %}
